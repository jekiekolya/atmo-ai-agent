name: CI

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  vitest:
    runs-on: ubuntu-latest
    # Integration tests and e2e need a real database (research R20).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: atmo
          POSTGRES_PASSWORD: atmo
          POSTGRES_DB: atmo_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atmo -d atmo_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Vitest
        run: npm run test:run

  e2e:
    runs-on: ubuntu-latest
    # Integration tests and e2e need a real database (research R20).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: atmo
          POSTGRES_PASSWORD: atmo
          POSTGRES_DB: atmo_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atmo -d atmo_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Playwright builds and serves the app itself; see playwright.config.ts.
      - name: Playwright
        run: npm run e2e

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
